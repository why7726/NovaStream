<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'">
  <title>NovaStream</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(1200px 600px at 50% -10%, #1b1b22 0%, #060606 60%);
      color: #fff; font: 15px/1.5 "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
      -webkit-user-select: none; user-select: none;
    }
    main { width: min(440px, 100vw - 48px); text-align: center; }
    .logo { font-size: 30px; letter-spacing: -0.03em; margin-bottom: 10px; }
    .logo b { font-weight: 600; } .logo span { font-weight: 300; color: rgba(255,255,255,.6); }
    p.sous { color: rgba(255,255,255,.55); font-size: 14px; margin-bottom: 34px; }
    label { display: block; text-align: left; font-size: 12px; font-weight: 600; color: rgba(255,255,255,.55); margin-bottom: 8px; }
    input {
      width: 100%; height: 50px; padding: 0 16px; border-radius: 14px; border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06); color: #fff; font: inherit; font-size: 15px; outline: none;
      -webkit-user-select: text; user-select: text;
    }
    input:focus { border-color: rgba(255,255,255,.35); }
    button {
      margin-top: 14px; width: 100%; height: 50px; border-radius: 999px; border: 0; cursor: pointer;
      background: #fff; color: #000; font: inherit; font-size: 15px; font-weight: 600;
    }
    button:disabled { opacity: .5; cursor: default; }
    .erreur { margin-top: 16px; color: #fca5a5; font-size: 13px; min-height: 20px; }
    .aide { margin-top: 26px; color: rgba(255,255,255,.35); font-size: 12px; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <div class="logo"><b>Nova</b><span>Stream</span></div>
    <p class="sous" data-fr="Connecte l'application à ton serveur NovaStream." data-en="Connect the app to your NovaStream server."></p>
    <form id="f">
      <label for="adresse" data-fr="Adresse du serveur" data-en="Server address"></label>
      <input id="adresse" placeholder="novastream.exemple.fr" autocomplete="off" spellcheck="false" autofocus>
      <button id="b" type="submit" data-fr="Se connecter" data-en="Connect"></button>
      <p class="erreur" id="e"></p>
    </form>
    <p class="aide" data-fr="C'est l'adresse que tu utilises dans ton navigateur pour ouvrir Nova. Demande-la à la personne qui t'a invité."
       data-en="It's the address you use in your browser to open Nova. Ask the person who invited you."></p>
  </main>
  <script>
    const en = !/^fr/i.test(navigator.language || '');
    for (const el of document.querySelectorAll('[data-fr]')) el.textContent = en ? el.dataset.en : el.dataset.fr;
    const q = new URLSearchParams(location.search);
    const champ = document.getElementById('adresse');
    const erreur = document.getElementById('e');
    const bouton = document.getElementById('b');
    if (q.get('serveur')) champ.value = q.get('serveur');
    if (q.get('message')) erreur.textContent = q.get('message');
    document.getElementById('f').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      erreur.textContent = '';
      bouton.disabled = true;
      bouton.textContent = en ? 'Connecting…' : 'Connexion…';
      try { await window.novaDesktop.definirServeur(champ.value); }
      catch (e) {
        erreur.textContent = String(e.message || e).replace(/^Error invoking remote method '[^']+': (Error: )?/, '');
        bouton.disabled = false;
        bouton.textContent = en ? 'Connect' : 'Se connecter';
      }
    });
  </script>
</body>
</html>
