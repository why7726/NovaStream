# NovaStream — raccourcis du lecteur natif (en plus de ceux de mpv)
#   Espace   pause            F / double-clic   plein écran
#   ← / →    -5 s / +5 s      ↑ / ↓             -60 s / +60 s
#   A        piste audio      S                 sous-titres
#   N        épisode suivant  Retour / Q        revenir à Nova

LEFT        seek -5
RIGHT       seek 5
UP          seek 60
DOWN        seek -60
WHEEL_UP    add volume 4
WHEEL_DOWN  add volume -4
f           cycle fullscreen
a           cycle audio
s           cycle sub
n           script-message nova-suivant
N           script-message nova-suivant
BS          quit
q           quit
Q           quit
