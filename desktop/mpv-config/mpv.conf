# NovaStream — réglages du lecteur natif (mpv)
# Ce dossier remplace la configuration mpv personnelle : l'application se
# comporte pareil sur tous les PC.

# ── Image ──
vo=gpu-next
# Décodage par la carte graphique (AV1, HEVC, VP9, H.264), repli logiciel sûr
hwdec=auto-safe
# Écran HDR sous Windows : on passe les métadonnées HDR à l'écran ;
# sinon, conversion HDR → SDR propre
target-colorspace-hint=yes
tone-mapping=auto

# ── Lecture réseau ──
cache=yes
demuxer-max-bytes=512MiB
demuxer-max-back-bytes=128MiB
demuxer-readahead-secs=90
network-timeout=30
ytdl=no

# ── Comportement ──
keep-open=no
save-position-on-quit=no
cursor-autohide=1200
volume-max=150
screenshot-directory=~~desktop/
# Langues par défaut (Nova choisit la piste à chaque lecture)
alang=fre,fra,fr,eng,en,jpn,ja
slang=fre,fra,fr

# ── Sous-titres ──
sub-auto=fuzzy
sub-font=Segoe UI Semibold
sub-font-size=42
sub-border-size=2.4
sub-shadow-offset=1.2
sub-shadow-color=0/0/0/0.6
sub-margin-y=46
# Les sous-titres ASS gardent leur mise en forme d'origine (karaokés, panneaux)
sub-ass-override=no

# ── Interface ──
osd-font=Segoe UI
osd-font-size=36
osd-bar-h=2.2
script-opts-append=osc-layout=bottombar
script-opts-append=osc-seekbarstyle=bar
script-opts-append=osc-hidetimeout=1400
script-opts-append=osc-fadeduration=180
script-opts-append=osc-deadzonesize=0.6
script-opts-append=osc-windowcontrols=auto
script-opts-append=osc-boxalpha=60
